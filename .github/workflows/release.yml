name: PyPI OIDC test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-test:
    runs-on: ubuntu-latest

    environment:
      name: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show safe GitHub identity context
        shell: bash
        run: |
          echo "repository=${GITHUB_REPOSITORY}"
          echo "repository_owner=${GITHUB_REPOSITORY_OWNER}"
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "actor=${GITHUB_ACTOR}"
          echo "ref=${GITHUB_REF}"

      - name: Request and sanitize OIDC identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in request_url else "?"

          url = request_url + separator + urllib.parse.urlencode({
              "audience": "terminal2-oidc-lab"
          })

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {request_token}"
              }
          )

          with urllib.request.urlopen(request) as response:
              oidc_response = json.load(response)

          raw_jwt = oidc_response["value"]

          parts = raw_jwt.split(".")

          if len(parts) != 3:
              raise RuntimeError("Unexpected JWT structure")

          payload_b64 = parts[1]
          payload_b64 += "=" * (-len(payload_b64) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload_b64).decode("utf-8")
          )

          allowed_claims = [
              "iss",
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "workflow",
              "workflow_ref",
              "workflow_sha",
              "job_workflow_ref",
              "ref",
              "ref_type",
              "actor",
              "actor_id",
              "run_id",
              "run_number",
              "run_attempt",
              "environment",
              "event_name",
              "iat",
              "nbf",
              "exp"
          ]

          sanitized_claims = {
              key: claims[key]
              for key in allowed_claims
              if key in claims
          }

          evidence = {
              "evidence_type": "github_actions_oidc_identity",
              "raw_jwt_stored": False,
              "audience_requested": "terminal2-oidc-lab",
              "claims": sanitized_claims
          }

          with open(
              "oidc-sanitized-claims.json",
              "w",
              encoding="utf-8"
          ) as output_file:
              json.dump(
                  evidence,
                  output_file,
                  indent=2,
                  sort_keys=True
              )

          print("OIDC token issued successfully")
          print("Raw JWT was NOT written to disk")
          print("Sanitized claims:")
          print(
              json.dumps(
                  evidence,
                  indent=2,
                  sort_keys=True
              )
          )
          PY

      - name: Upload sanitized OIDC evidence
        uses: actions/upload-artifact@v4
        with:
          name: terminal2-oidc-positive
          path: oidc-sanitized-claims.json
          if-no-files-found: error

      - name: Stop before publishing
        shell: bash
        run: |
          echo "Positive OIDC boundary confirmed."
          echo "No package was published."
          echo "No raw OIDC JWT was stored."
