name: Terminal2 TestPyPI Wrong Workflow Boundary

on:
  workflow_dispatch:

jobs:
  negative-federation:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Record safe workload metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          fields = [
              "GITHUB_RUN_ID",
              "GITHUB_RUN_NUMBER",
              "GITHUB_RUN_ATTEMPT",
              "GITHUB_JOB",
              "GITHUB_WORKFLOW",
              "GITHUB_WORKFLOW_REF",
              "GITHUB_REPOSITORY",
              "GITHUB_REPOSITORY_ID",
              "GITHUB_REPOSITORY_OWNER",
              "GITHUB_REPOSITORY_OWNER_ID",
              "GITHUB_ACTOR",
              "GITHUB_ACTOR_ID",
              "GITHUB_REF",
              "GITHUB_SHA",
              "GITHUB_EVENT_NAME",
          ]

          result = {
              "schema": "terminal2-testpypi-federation-boundary-v1",
              "scenario": "WRONG_WORKFLOW_TRUST_BOUNDARY",
              "metadata": {
                  key: os.getenv(key)
                  for key in fields
              },
              "declared_permissions": {
                  "contents": "read",
                  "id-token": "write"
              },
              "expected_result": "TestPyPI trusted publisher mismatch",
              "raw_oidc_jwt_stored": False,
              "raw_testpypi_token_stored": False
          }

          with open("01-negative-workload-metadata.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))
          PY

      - name: Collect safe OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.parse
          import urllib.request

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          audience = "testpypi"

          sep = "&" if "?" in request_url else "?"
          url = request_url + sep + urllib.parse.urlencode({
              "audience": audience
          })

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {request_token}"
              }
          )

          with urllib.request.urlopen(req) as r:
              response = json.loads(r.read())

          jwt = response["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          allowed = [
              "iss",
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "workflow",
              "workflow_ref",
              "job_workflow_ref",
              "ref",
              "sha",
              "run_id",
              "run_number",
              "run_attempt",
              "actor",
              "actor_id",
              "event_name",
              "iat",
              "nbf",
              "exp",
              "jti"
          ]

          safe = {
              key: claims.get(key)
              for key in allowed
              if key in claims
          }

          result = {
              "schema": "terminal2-testpypi-negative-oidc-claims-v1",
              "scenario": "WRONG_WORKFLOW_TRUST_BOUNDARY",
              "audience_requested": audience,
              "claims": safe,
              "raw_oidc_jwt_stored": False,
              "request_token_stored": False
          }

          with open("02-negative-oidc-safe-claims.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))

          jwt = None
          request_token = None
          PY

      - name: Build package
        working-directory: federation-lab
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Attempt TestPyPI trusted publish
        id: publish
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: federation-lab/dist/

      - name: Record boundary result
        shell: bash
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os

          outcome = os.environ.get("PUBLISH_OUTCOME")

          result = {
              "schema": "terminal2-testpypi-federation-result-v1",
              "scenario": "WRONG_WORKFLOW_TRUST_BOUNDARY",
              "publish_step_outcome": outcome,
              "expected": "failure",
              "success": outcome == "success",
              "raw_oidc_jwt_stored": False,
              "raw_testpypi_token_stored": False
          }

          with open("03-negative-federation-result.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))
          PY

      - name: Upload safe negative federation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal2-testpypi-federation-negative
          path: |
            01-negative-workload-metadata.json
            02-negative-oidc-safe-claims.json
            03-negative-federation-result.json
