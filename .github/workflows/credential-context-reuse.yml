name: Credential Context Reuse Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse-credential:
    runs-on: ubuntu-latest

    steps:
      - name: Record execution context
        shell: bash
        run: |
          mkdir -p evidence

          jq -n \
            --arg schema "credential-context-runtime-v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg actor "$GITHUB_ACTOR" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            '{
              schema: $schema,
              execution_context: "github_actions_hosted_runner",
              repository: $repository,
              workflow: $workflow,
              workflow_ref: $workflow_ref,
              run_id: $run_id,
              run_attempt: $run_attempt,
              actor: $actor,
              ref: $ref,
              sha: $sha,
              runner_os: $runner_os,
              runner_arch: $runner_arch,
              raw_credential_stored: false
            }' > evidence/01-execution-context.json

      - name: Fingerprint reused credential
        shell: bash
        env:
          REUSE_PAT: ${{ secrets.AGENT_RUNTIME_REUSE_PAT }}
        run: |
          FINGERPRINT=$(printf '%s' "$REUSE_PAT" | sha256sum | awk '{print $1}' | cut -c1-16)

          jq -n \
            --arg schema "credential-context-fingerprint-v1" \
            --arg type "github_fine_grained_pat" \
            --arg fingerprint "$FINGERPRINT" \
            '{
              schema: $schema,
              credential_type: $type,
              fingerprint_sha256_prefix: $fingerprint,
              raw_credential_stored: false
            }' > evidence/02-credential-fingerprint.json

      - name: Controlled issue creation using reused credential
        id: create_issue
        shell: bash
        env:
          REUSE_PAT: ${{ secrets.AGENT_RUNTIME_REUSE_PAT }}
        run: |
          set +e

          RESPONSE=$(curl -sS \
            -w '\n%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${REUSE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d '{
              "title":"Credential context reuse authority test",
              "body":"Controlled experiment: same credential observed from a different execution context."
            }')

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          ISSUE_NUMBER=$(echo "$BODY" | jq -r '.number // empty')
          RESOURCE_ID=$(echo "$BODY" | jq -r '.id // empty')
          MESSAGE=$(echo "$BODY" | jq -r '.message // empty')

          if [ "$HTTP_STATUS" = "201" ]; then
            SUCCESS=true
          else
            SUCCESS=false
          fi

          jq -n \
            --arg schema "credential-context-execution-v1" \
            --arg action "issues.create" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg status "$HTTP_STATUS" \
            --arg issue "$ISSUE_NUMBER" \
            --arg resource "$RESOURCE_ID" \
            --arg message "$MESSAGE" \
            --argjson success "$SUCCESS" \
            '{
              schema: $schema,
              action: $action,
              target_repository: $repository,
              http_status: ($status | tonumber),
              success: $success,
              issue_number:
                (if $issue == "" then null else ($issue | tonumber) end),
              resource_id:
                (if $resource == "" then null else ($resource | tonumber) end),
              response_message:
                (if $message == "" then null else $message end),
              raw_credential_stored: false
            }' > evidence/03-execution-result.json

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Cleanup controlled issue
        if: steps.create_issue.outputs.issue_number != ''
        shell: bash
        env:
          REUSE_PAT: ${{ secrets.AGENT_RUNTIME_REUSE_PAT }}
          ISSUE_NUMBER: ${{ steps.create_issue.outputs.issue_number }}
        run: |
          RESPONSE=$(curl -sS \
            -w '\n%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${REUSE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -d '{"state":"closed"}')

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          jq -n \
            --arg schema "credential-context-cleanup-v1" \
            --arg issue "$ISSUE_NUMBER" \
            --arg status "$HTTP_STATUS" \
            '{
              schema: $schema,
              action: "issues.close",
              issue_number: ($issue | tonumber),
              http_status: ($status | tonumber),
              success: ($status == "200"),
              raw_credential_stored: false
            }' > evidence/04-cleanup.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-context-reuse-evidence
          path: evidence/
