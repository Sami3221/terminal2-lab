name: Terminal2 Workload Authority Lab

on:
  workflow_dispatch:

jobs:

  low-authority:
    name: Low authority - write denied
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read

    steps:
      - name: Record safe workload metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os

          fields = [
              "GITHUB_RUN_ID",
              "GITHUB_RUN_NUMBER",
              "GITHUB_RUN_ATTEMPT",
              "GITHUB_JOB",
              "GITHUB_WORKFLOW",
              "GITHUB_WORKFLOW_REF",
              "GITHUB_REPOSITORY",
              "GITHUB_REPOSITORY_ID",
              "GITHUB_REPOSITORY_OWNER",
              "GITHUB_REPOSITORY_OWNER_ID",
              "GITHUB_ACTOR",
              "GITHUB_ACTOR_ID",
              "GITHUB_REF",
              "GITHUB_SHA",
              "GITHUB_EVENT_NAME",
          ]

          data = {
              "schema": "terminal2-github-actions-workload-v1",
              "scenario": "LOW_AUTHORITY",
              "metadata": {k: os.getenv(k) for k in fields},
              "declared_permissions": {
                  "contents": "read",
                  "issues": "read"
              },
              "secrets_stored": False,
              "tokens_stored": False
          }

          with open("01-workload-metadata.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Attempt controlled issue write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/issues"

          body = json.dumps({
              "title": "terminal2-authority-low-should-not-create",
              "body": "Controlled Terminal 2 authority-boundary test."
          }).encode()

          req = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )

          status = None
          response_excerpt = None

          try:
              with urllib.request.urlopen(req) as r:
                  status = r.status
                  payload = json.loads(r.read())
                  response_excerpt = {
                      "issue_number": payload.get("number"),
                      "state": payload.get("state"),
                  }
          except urllib.error.HTTPError as e:
              status = e.code
              raw = e.read().decode(errors="replace")
              try:
                  payload = json.loads(raw)
                  response_excerpt = {
                      "message": payload.get("message")
                  }
              except Exception:
                  response_excerpt = {"message": "HTTP error"}

          result = {
              "schema": "terminal2-github-actions-execution-v1",
              "scenario": "LOW_AUTHORITY",
              "action": "issues.create",
              "repository": repo,
              "http_status": status,
              "success": status == 201,
              "response": response_excerpt,
              "expected_boundary": "write denied because issues:write was not granted",
              "raw_token_stored": False
          }

          with open("02-write-attempt.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))
          PY

      - name: Record OIDC negative boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os

          result = {
              "schema": "terminal2-github-actions-oidc-boundary-v1",
              "scenario": "OIDC_DISABLED",
              "id_token_permission_declared": False,
              "request_url_present": bool(os.getenv("ACTIONS_ID_TOKEN_REQUEST_URL")),
              "request_token_present": bool(os.getenv("ACTIONS_ID_TOKEN_REQUEST_TOKEN")),
              "raw_oidc_token_stored": False
          }

          with open("03-oidc-negative.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))
          PY

      - name: Upload low-authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: terminal2-low-authority
          path: |
            01-workload-metadata.json
            02-write-attempt.json
            03-oidc-negative.json


  expanded-authority:
    name: Expanded authority - write succeeds + OIDC
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Record safe workload metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os

          fields = [
              "GITHUB_RUN_ID",
              "GITHUB_RUN_NUMBER",
              "GITHUB_RUN_ATTEMPT",
              "GITHUB_JOB",
              "GITHUB_WORKFLOW",
              "GITHUB_WORKFLOW_REF",
              "GITHUB_REPOSITORY",
              "GITHUB_REPOSITORY_ID",
              "GITHUB_REPOSITORY_OWNER",
              "GITHUB_REPOSITORY_OWNER_ID",
              "GITHUB_ACTOR",
              "GITHUB_ACTOR_ID",
              "GITHUB_REF",
              "GITHUB_SHA",
              "GITHUB_EVENT_NAME",
          ]

          data = {
              "schema": "terminal2-github-actions-workload-v1",
              "scenario": "EXPANDED_AUTHORITY",
              "metadata": {k: os.getenv(k) for k in fields},
              "declared_permissions": {
                  "contents": "read",
                  "issues": "write",
                  "id-token": "write"
              },
              "secrets_stored": False,
              "tokens_stored": False
          }

          with open("01-workload-metadata.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Perform controlled issue write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/issues"

          body = json.dumps({
              "title": "terminal2-authority-expanded-test",
              "body": "Controlled Terminal 2 authority execution test."
          }).encode()

          req = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(req) as r:
              payload = json.loads(r.read())
              status = r.status

          result = {
              "schema": "terminal2-github-actions-execution-v1",
              "scenario": "EXPANDED_AUTHORITY",
              "action": "issues.create",
              "repository": repo,
              "http_status": status,
              "success": status == 201,
              "issue_number": payload.get("number"),
              "issue_node_id": payload.get("node_id"),
              "raw_token_stored": False
          }

          with open("02-write-success.json", "w") as f:
              json.dump(result, f, indent=2)

          with open("issue-number.txt", "w") as f:
              f.write(str(payload["number"]))

          print(json.dumps(result, indent=2))
          PY

      - name: Close controlled test issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          number = open("issue-number.txt").read().strip()

          url = f"https://api.github.com/repos/{repo}/issues/{number}"
          body = json.dumps({"state": "closed"}).encode()

          req = urllib.request.Request(
              url,
              data=body,
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(req) as r:
              payload = json.loads(r.read())

          result = {
              "schema": "terminal2-github-actions-cleanup-v1",
              "action": "issues.close",
              "issue_number": payload.get("number"),
              "state": payload.get("state"),
              "raw_token_stored": False
          }

          with open("03-cleanup.json", "w") as f:
              json.dump(result, f, indent=2)
          PY

      - name: Collect safe OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          audience = "terminal2-authority-lab"

          sep = "&" if "?" in request_url else "?"
          url = request_url + sep + urllib.parse.urlencode({
              "audience": audience
          })

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {request_token}"
              }
          )

          with urllib.request.urlopen(req) as r:
              response = json.loads(r.read())

          jwt = response["value"]

          # Decode claims in memory only.
          payload_segment = jwt.split(".")[1]
          payload_segment += "=" * (-len(payload_segment) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload_segment).decode()
          )

          allowed = [
              "iss",
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "workflow",
              "workflow_ref",
              "job_workflow_ref",
              "ref",
              "sha",
              "run_id",
              "run_number",
              "run_attempt",
              "actor",
              "actor_id",
              "event_name",
              "environment",
              "iat",
              "nbf",
              "exp",
              "jti"
          ]

          safe_claims = {
              k: claims.get(k)
              for k in allowed
              if k in claims
          }

          result = {
              "schema": "terminal2-github-actions-oidc-claims-v1",
              "scenario": "OIDC_ENABLED",
              "audience_requested": audience,
              "claims": safe_claims,
              "raw_jwt_stored": False,
              "request_token_stored": False
          }

          with open("04-oidc-safe-claims.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))

          # Do not persist JWT.
          jwt = None
          request_token = None
          PY

      - name: Upload expanded-authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: terminal2-expanded-authority
          path: |
            01-workload-metadata.json
            02-write-success.json
            03-cleanup.json
            04-oidc-safe-claims.json
