name: Terminal2 TestPyPI Federation Lab

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build package
        working-directory: federation-lab
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Record safe workload metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          fields = [
              "GITHUB_RUN_ID",
              "GITHUB_RUN_NUMBER",
              "GITHUB_RUN_ATTEMPT",
              "GITHUB_JOB",
              "GITHUB_WORKFLOW",
              "GITHUB_WORKFLOW_REF",
              "GITHUB_REPOSITORY",
              "GITHUB_REPOSITORY_ID",
              "GITHUB_REPOSITORY_OWNER",
              "GITHUB_REPOSITORY_OWNER_ID",
              "GITHUB_ACTOR",
              "GITHUB_ACTOR_ID",
              "GITHUB_REF",
              "GITHUB_SHA",
              "GITHUB_EVENT_NAME",
          ]

          result = {
              "schema": "terminal2-testpypi-federation-workload-v1",
              "scenario": "FEDERATION_POSITIVE",
              "metadata": {
                  key: os.getenv(key)
                  for key in fields
              },
              "declared_permissions": {
                  "contents": "read",
                  "id-token": "write"
              },
              "raw_oidc_jwt_stored": False,
              "raw_testpypi_token_stored": False
          }

          with open("01-federation-workload-metadata.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))
          PY

      - name: Publish to TestPyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: federation-lab/dist/

      - name: Upload safe federation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal2-testpypi-federation-positive
          path: 01-federation-workload-metadata.json
